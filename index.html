<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Vibe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Music Vibe</h1>
    </header>

    <main>
        <div class="search-container">
            <input type="text" id="busca" placeholder="Buscar música ou artista...">
            <select id="filtro-estilo">
                <option value="Todos">Todos os estilos</option>
                <option value="K-Pop">K-Pop</option>
                <option value="Sertanejo">Sertanejo</option>
                <option value="Pop">Pop</option>
                <option value="Rock">Rock</option>
                <option value="Hip-Hop">Hip-Hop</option>
                <option value="Eletrônica">Eletrônica</option>
                <option value="Jazz">Jazz</option>
            </select>
        </div>
        <div id="lista-de-musicas">
            <!-- Aqui serão adicionadas as músicas dinamicamente -->
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Music Vibe - Todos os direitos reservados</p>
    </footer>
</body>
</html>
